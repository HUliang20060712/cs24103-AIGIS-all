name: aigis-ci
on: [push, pull_request]
jobs:
  build-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: |
          for d in services/reco services/vision services/gateway; do
            mvn -B -q -f $d/pom.xml -DskipTests compile || exit 1
          done
  build-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m compileall -q desktop/src services/reco/tools
  verify:
    runs-on: ubuntu-latest
    needs: build-java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: mvn -B -q -f services/reco/pom.xml test
      - run: python3 services/reco/tools/offline_eval.py
  ai-trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test -f services/reco/docs/ai-log/lab1-ai-log.md
