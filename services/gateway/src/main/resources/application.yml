# 未接 Nacos 前用直连地址；接入后改为 lb://<service-id>
server:
  port: 8081
spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: reco
          uri: http://127.0.0.1:8083
          predicates:
            - Path=/api/reco/**
        - id: vision
          uri: http://127.0.0.1:8084
          predicates:
            - Path=/api/vision/**
        - id: dialog
          uri: http://127.0.0.1:8085
          predicates:
            - Path=/api/chat/**
      default-filters:
        - name: Retry
          args:
            retries: 1
            series: SERVER_ERROR
